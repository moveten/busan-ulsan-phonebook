<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1f2e">
<meta name="description" content="부산울산지방병무청 직원 연락처 검색 및 관리 앱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="병무청 전화번호부">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>부산울산지방병무청 전화번호부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8FC;
    --surface:#FFFFFF;
    --ink:#1B2130;
    --ink-soft:#7A8296;
    --primary:#3B5BFF;
    --primary-soft:#E8ECFF;
    --primary-deep:#2743D6;
    --mint:#00C2A8;
    --coral:#FF8B6B;
    --line:#EAEDF4;
    --border-soft:#E3E7F0;
    --danger:#EF5B5B;
    --shadow: 0 4px 16px rgba(30,41,80,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12141C;
      --surface:#1C1F2B;
      --ink:#EDEFF7;
      --ink-soft:#A8AFC2;
      --primary:#7C93FF;
      --primary-soft:#232A47;
      --primary-deep:#AEBBFF;
      --mint:#3DDCC4;
      --coral:#FFA485;
      --line:#3A3F52;
      --border-soft:#3A3F52;
      --danger:#FF7A7A;
      --shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141C;
    --surface:#1C1F2B;
    --ink:#EDEFF7;
    --ink-soft:#A8AFC2;
    --primary:#7C93FF;
    --primary-soft:#232A47;
    --primary-deep:#AEBBFF;
    --mint:#3DDCC4;
    --coral:#FFA485;
    --line:#3A3F52;
    --border-soft:#3A3F52;
    --danger:#FF7A7A;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html, body{
    margin:0;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    line-height:1.5;
    overflow-x:hidden;
  }
  body.modal-open{
    overflow:hidden;
    position:fixed;
    left:0;
    right:0;
    width:100%;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:16vh 20px 100px;
    min-height:100vh;
  }
  .wrap.active{
    padding-top:32px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom:4px;
  }
  .wrap.active .brand{
    justify-content:flex-start;
    margin-bottom:4px;
  }
  .brand-address{
    text-align:center;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:44px;
  }
  .wrap.active .brand-address{
    text-align:left;
    margin-left:40px;
    margin-bottom:40px;
  }
  .brand-dot{
    width:30px;
    height:30px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--primary), var(--mint));
    flex-shrink:0;
  }
  h1{
    font-weight:800;
    font-size:1.25rem;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }

  .searchbar{
    position:relative;
  }
  .searchbar input{
    width:100%;
    padding:15px 56px 15px 46px;
    font-size:1rem;
    font-family:inherit;
    border:1.5px solid var(--line);
    border-radius:16px;
    background:var(--surface);
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .searchbar input::placeholder{ color:var(--ink-soft); }
  .searchbar input:focus-visible{
    outline:none;
    border-color:var(--primary);
  }
  .searchbar::before{
    content:"";
    position:absolute;
    left:18px;
    top:50%;
    width:15px;
    height:15px;
    transform:translateY(-50%);
    border:2px solid var(--primary);
    border-radius:50%;
    box-shadow: 7px 7px 0 -3px var(--primary);
  }
  .searchbar .clear-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:var(--bg-card);
    color:var(--ink-soft);
    font-size:22px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .searchbar .clear-btn.show{ display:flex; }
  .searchbar .clear-btn:hover{ color:var(--ink); }

  .utility-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:28px;
    margin-bottom:2px;
  }
  .wrap.active .utility-row{
    justify-content:flex-start;
  }
  .utility-row button{
    cursor:pointer;
    font-family:inherit;
    font-size:0.95rem;
    font-weight:700;
    padding:13px 20px;
    border-radius:16px;
    border:none;
    background:var(--primary-soft);
    color:var(--primary-deep);
    width:100%;
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  .utility-row button:active{ transform:scale(0.97); }
  .utility-row button.primary{
    background:var(--primary-soft);
    color:var(--primary-deep);
  }
  .utility-row button:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
  }

  .browse-exit-fixed{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:9;
    cursor:pointer;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    padding:13px 26px;
    border-radius:24px;
    border:none;
    background:var(--ink);
    color:var(--bg);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }
  .browse-exit-fixed:active{ transform:translateX(-50%) scale(0.96); }
  .browse-exit-fixed.stacked{ bottom:calc(76px + env(safe-area-inset-bottom)); }

  .admin-exit-fixed{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:9;
    cursor:pointer;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    padding:13px 26px;
    border-radius:24px;
    border:none;
    background:var(--danger);
    color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
  }
  .admin-exit-fixed:active{ transform:translateX(-50%) scale(0.96); }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 6px;
    margin:20px 0 6px;
  }
  .tabs::-webkit-scrollbar{ height:0; }
  .tab{
    flex:0 0 auto;
    padding:9px 16px;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    color:#fff;
    background:var(--primary);
    border-color:var(--primary);
  }
  .tab-transfer{
    color:var(--coral);
    border-color:var(--coral);
  }
  .tab-transfer.active{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }
  .tab-fav{
    color:#FFC542;
    border-color:#FFC542;
  }
  .tab-fav.active{
    background:#FFC542;
    border-color:#FFC542;
    color:#3A2E00;
  }
  .tab:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
  }

  .section-label{
    margin:24px 2px 10px;
    color:var(--ink-soft);
    font-size:0.78rem;
    font-weight:700;
  }
  .section-label:first-child{ margin-top:6px; }

  .card{
    position:relative;
    overflow:hidden;
    margin-bottom:8px;
    border-radius:12px;
  }
  .card-body{
    background:var(--surface);
    border:0.5px solid var(--border-soft);
    border-radius:12px;
    padding:14px 16px;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:1;
  }
  .card-delete-btn{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:88px;
    border:none;
    background:var(--danger);
    color:#fff;
    font-family:inherit;
    font-weight:800;
    font-size:0.92rem;
    cursor:pointer;
    z-index:0;
  }
  .fav-btn{
    flex-shrink:0;
    background:none;
    border:none;
    padding:2px;
    font-size:22px;
    line-height:1;
    color:var(--line);
    cursor:pointer;
  }
  .fav-btn.active{ color:#FFC542; }
  .card .left{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card .name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .card .name{
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    white-space:nowrap;
  }
  .card .dept{
    font-size:12px;
    font-weight:800;
    color:var(--primary);
    background:var(--primary-soft);
    padding:3px 10px;
    border-radius:8px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .change-badge{
    font-family:inherit;
    font-size:11px;
    font-weight:800;
    border:none;
    border-radius:8px;
    padding:3px 9px;
    white-space:nowrap;
    flex-shrink:0;
    cursor:pointer;
    background:var(--coral);
    color:#fff;
  }
  .card .duty{
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    line-height:1.5;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .search-hit{
    background:transparent;
    color:var(--coral);
    border-radius:0;
    padding:0;
    font-weight:800;
  }
  .new-badge{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:var(--coral);
    color:#fff;
    font-size:0.68rem;
    font-weight:800;
    padding:2px 8px;
    border-radius:9px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .card .meta{
    margin-top:2px;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .card .phone-col{
    flex-shrink:0;
    align-self:stretch;
    display:flex;
    align-items:center;
    padding-left:12px;
  }
  .card .phone-link{
    color:var(--ink);
    background:transparent;
    text-decoration:none;
    font-weight:700;
    font-size:19px;
    padding:0;
    white-space:nowrap;
  }
  .card-actions{ display:none; }

  .card-body{ touch-action:pan-y; user-select:none; transition:transform 0.22s ease; }
  .card.revealed .card-body{ box-shadow:0 4px 16px rgba(0,0,0,0.2); }
  .name-editable{
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    cursor:pointer;
    text-align:left;
  }

  .admin-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:14px;
    display:flex;
    justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events:none;
  }
  .admin-footer button{
    pointer-events:auto;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.78rem;
    font-family:inherit;
    cursor:pointer;
    padding:6px 10px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .admin-footer button:hover{ color:var(--primary); }
  .admin-footer button.on{ color:var(--mint); font-weight:700; }

  .modal.small{ max-width:340px; }
  .modal p.confirm-msg{
    font-size:0.95rem;
    color:var(--ink);
    margin:0 0 4px;
    text-align:center;
    padding:10px 0 4px;
  }

  .change-info-overlay{ align-items:center; cursor:pointer; }
  .change-info-modal{
    cursor:default;
    text-align:center;
  }
  .change-info-modal h2{
    text-align:center;
    margin-bottom:16px;
  }
  .change-info-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .change-info-row:first-of-type{ border-top:none; }
  .change-info-label{
    font-size:0.78rem;
    font-weight:700;
    color:var(--ink-soft);
  }
  .change-info-val{
    font-size:1.05rem;
    font-weight:700;
    color:var(--ink);
  }
  .change-info-arrow{ color:var(--coral); margin:0 6px; }
  .change-info-hint{
    margin-top:16px;
    font-size:0.78rem;
    color:var(--ink-soft);
  }

  .archive-banner{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    color:var(--ink-soft);
    padding:0;
    margin-top:0;
    margin-bottom:10px;
    font-size:0.98rem;
    font-weight:700;
  }
  .archive-banner-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .archive-banner button{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:8px 14px;
    font-size:0.85rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
  }
  .archive-banner #archiveExit{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
  }

  .admin-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .admin-bar-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .admin-current-base{
    font-size:0.78rem;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .admin-bar-backup{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:2px;
  }
  .admin-bar-backup button, .backup-restore-label{
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    font-size:0.76rem;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .admin-bar button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:12px;
    font-size:0.82rem;
    font-weight:700;
    padding:9px 14px;
  }
  #adminDateChip{
    background:var(--primary);
    color:#fff;
  }
  #promoteBaseDate{
    background:var(--primary);
    color:#fff;
  }

  .archive-item{
    width:100%;
    text-align:left;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--bg);
    color:var(--ink);
    font-size:0.92rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:8px;
  }
  .archive-item:hover{ border-color:var(--primary); }
  .archive-item .archive-item-sub{
    display:block;
    font-size:0.76rem;
    font-weight:500;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .archive-item.today{ border-color:var(--primary); background:var(--primary-soft); }
  .year-chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:6px;
  }
  .year-chip{
    flex-shrink:0;
    font-family:inherit;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    font-size:0.85rem;
    font-weight:700;
    padding:8px 16px;
    border-radius:12px;
  }
  .year-chip.active{
    border-color:var(--primary);
    background:var(--primary);
    color:#fff;
  }
  .archive-date-list{
    max-height:320px;
    overflow-y:auto;
  }
  .archive-empty{
    color:var(--ink-soft);
    font-size:0.88rem;
    text-align:center;
    padding:18px 4px;
  }

  .add-date-options{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-top:6px;
    margin-bottom:18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .add-date-section-title{
    font-size:0.95rem;
    font-weight:800;
    color:var(--ink);
    margin-bottom:8px;
  }
  .archive-action-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .archive-action-row button{
    flex:1;
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:0.9rem;
    padding:12px 10px;
  }
  #mgrEditBtn{ background:var(--primary); color:#fff; }
  #mgrAddBtn{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  #mgrDeleteBtn{ background:var(--danger); color:#fff; }
  .add-date-back{
    font-family:inherit;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--ink);
    font-size:0.85rem;
    font-weight:700;
    padding:9px 16px;
    border-radius:10px;
    margin-bottom:16px;
  }
  .add-date-options .field{ margin-bottom:8px; }
  .add-date-options .field input[type="date"]{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
  }
  .add-date-option{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:14px 0;
  }
  .add-date-option:first-child{
    border-bottom:1px solid var(--line);
  }
  .add-date-option-title{
    font-size:0.9rem;
    font-weight:800;
    color:var(--ink);
  }
  .add-date-option-hint{
    font-size:0.76rem;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .add-date-option input[type="file"]{
    font-size:0.82rem;
    color:var(--ink-soft);
    font-family:inherit;
  }
  .add-date-option button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    font-size:0.88rem;
    padding:11px 16px;
  }
  .add-date-option button:disabled{ opacity:0.6; cursor:default; }
  .add-date-divider{
    text-align:center;
    font-size:0.78rem;
    font-weight:700;
    color:var(--ink-soft);
    margin:2px 0;
  }

  .pdf-review-modal{
    max-width:600px;
    width:100%;
  }
  .pdf-review-list{
    max-height:50vh;
    overflow-y:auto;
    margin:14px 0;
  }
  .pdf-review-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .pdf-review-row input{
    padding:8px 10px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    font-size:16px;
  }
  .pdf-review-row .pdf-row-phone{ grid-column:1 / -1; }
  .pdf-review-row .pdf-row-del{
    grid-column:1 / -1;
    justify-self:end;
    background:none;
    border:none;
    color:var(--danger);
    font-size:0.78rem;
    font-weight:700;
    cursor:pointer;
    padding:2px 4px;
  }
  .pdf-review-hint{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:0.88rem;
  }

  /* modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,24,40,0.4);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{ display:flex; }

function loadFavorites(){
  try{
    const raw = localStorage.getItem(FAVORITES_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? new Set(parsed) : new Set();
  }catch(e){
    return new Set();
  }
}

function saveFavorites(set){
  try{
    localStorage.setItem(FAVORITES_KEY, JSON.stringify(Array.from(set)));
  }catch(e){
    // 저장 실패는 조용히 무시
  }
}

let favorites = loadFavorites();

function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites(favorites);
  render();
}

function loadContacts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seedData));
      return [...seedData];
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [...seedData];
  }catch(e){
    return [...seedData];
  }
}

function saveContacts(list){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }catch(e){
    showToast('저장에 실패했습니다');
  }
  snapshotBase(list);
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const label = `${y}년 ${m}월 ${d}일`;
  return dateStr === baseDate ? `${label} (현재 기준일)` : label;
}

function formatRefDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${y}. ${m}. ${d}.`;
}

function loadArchive(){
  try{
    const raw = localStorage.getItem(ARCHIVE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){
    return {};
  }
}

function loadBaseDate(){
  try{
    return localStorage.getItem(BASE_DATE_KEY) || DEFAULT_BASE_DATE;
  }catch(e){
    return DEFAULT_BASE_DATE;
  }
}

function saveBaseDate(d){
  try{
    localStorage.setItem(BASE_DATE_KEY, d);
  }catch(e){
    // 저장 실패는 조용히 무시
  }
}

function snapshotBase(list){
  try{
    const arc = loadArchive();
    arc[baseDate] = list;
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc));
  }catch(e){
    // 아카이브 저장 실패는 조용히 무시 (연락처 저장 자체는 이미 완료됨)
  }
}

(function cleanupStrayDates(){
  const CLEANUP_FLAG = 'busan-ulsan-mma-cleanup-v1';
  try{
    if(!localStorage.getItem(CLEANUP_FLAG)){
      const arc = loadArchive();
      const cleaned = {};
      cleaned[baseDate] = arc[baseDate] || contacts;
      localStorage.setItem(ARCHIVE_KEY, JSON.stringify(cleaned));
      localStorage.setItem(CLEANUP_FLAG, '1');
    }
  }catch(e){
    // 정리 실패는 조용히 무시
  }
})();

// 일회성 보정: 김택로(부속실)의 업무를 병역판정관으로, 순서를 김창영보다 위로
(function patchDataFix_v1(){
  const FLAG = 'busan-ulsan-mma-patch-v1';
  try{
    if(!localStorage.getItem(FLAG)){
      let changed = false;
      const i2 = contacts.findIndex(c => c.id === 'p002');
      if(i2 > -1 && contacts[i2].duty !== '병역판정관'){
        contacts[i2] = {...contacts[i2], duty:'병역판정관'};
        changed = true;
      }
      const i1 = contacts.findIndex(c => c.id === 'p001');
      const i2b = contacts.findIndex(c => c.id === 'p002');
      if(i1 > -1 && i2b > -1 && i2b > i1){
        const [item] = contacts.splice(i2b, 1);
        const newI1 = contacts.findIndex(c => c.id === 'p001');
        contacts.splice(newI1, 0, item);
        changed = true;
      }
      if(changed) saveContacts(contacts);
      localStorage.setItem(FLAG, '1');
    }
  }catch(e){
    // 보정 실패는 조용히 무시
  }
})();

const fDeptNew = document.getElementById('fDeptNew');
const fDuty = document.getElementById('fDuty');
const fPhone = document.getElementById('fPhone');
const fNote = document.getElementById('fNote');
const editId = document.getElementById('editId');
const toast = document.getElementById('toast');

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1600);
}

function getDepartments(list){
  const seen = new Set();
  const order = [];
  (list||contacts).forEach(c => {
    if(c.dept && !seen.has(c.dept)){
      seen.add(c.dept);
      order.push(c.dept);
    }
  });
  return order;
}

function getWorkingList(){
  if(!adminWorkingDate || adminWorkingDate === baseDate) return contacts;
  const arc = loadArchive();
  return arc[adminWorkingDate] || [];
}

function commitWorkingList(list){
  if(!adminWorkingDate || adminWorkingDate === baseDate){
    contacts = list;
    saveContacts(contacts);
    snapshotBase(contacts);
  }else{
    const arc = loadArchive();
    arc[adminWorkingDate] = list;
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc)); }
    catch(e){ showToast('저장에 실패했습니다'); }
  }
}

function chipLabel(dateStr){
  if(!dateStr || dateStr === baseDate) return '기준일';
  const [,m,d] = dateStr.split('-').map(Number);
  return `${m}월 ${d}일`;
}

function effectiveContacts(){
  if(adminMode) return getWorkingList();
  if(archiveDate){
    const arc = loadArchive();
    return arc[archiveDate] || [];
  }
  return contacts;
}

function isActiveView(){
  return searchTerm.trim() !== '' || browseMode || !!archiveDate || adminMode;
}

function updateWrapState(){
  wrapEl.classList.toggle('active', isActiveView());
}

function getPreviousArchiveDate(refDate){
  const arc = loadArchive();
  const dates = Object.keys(arc).filter(d => d < refDate).sort((a,b)=> b.localeCompare(a));
  return dates[0] || null;
}

function getChangedPeople(){
  const refDate = archiveDate || baseDate;
  const prevDate = getPreviousArchiveDate(refDate);
  if(!prevDate) return [];
  const arc = loadArchive();
  const prevList = arc[prevDate] || [];
  const currList = effectiveContacts();
  const prevMap = {};
  prevList.forEach(p => { prevMap[p.id] = p; });
  const changed = [];
  currList.forEach(c => {
    const prev = prevMap[c.id];
    if(!prev) return;
    const deptChanged = prev.dept !== c.dept;
    const dutyChanged = (prev.duty||'') !== (c.duty||'');
    if(deptChanged || dutyChanged){
      changed.push({
        ...c,
        changeType: deptChanged ? 'transfer' : 'duty',
        deptChanged, dutyChanged,
        fromDept: prev.dept, toDept: c.dept,
        fromDuty: prev.duty || '(없음)', toDuty: c.duty || '(없음)'
      });
    }
  });
  return changed;
}

function renderTabs(){
  if(!browseMode){
    tabsEl.style.display = 'none';
    tabsEl.innerHTML = '';
    return;
  }
  tabsEl.style.display = 'flex';
  const depts = getDepartments(effectiveContacts());
  const transferCount = getChangedPeople().filter(c => c.changeType === 'transfer').length;
  const favCount = effectiveContacts().filter(c => favorites.has(c.id)).length;
  tabsEl.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'tab' + (activeTab === '전체' ? ' active' : '');
  allBtn.textContent = '전체';
  allBtn.onclick = () => { activeTab = '전체'; render(); };
  tabsEl.appendChild(allBtn);
  if(favCount > 0){
    const favTabBtn = document.createElement('button');
    favTabBtn.className = 'tab tab-fav' + (activeTab === '즐겨찾기' ? ' active' : '');
    favTabBtn.textContent = `★ 즐겨찾기 ${favCount}`;
    favTabBtn.onclick = () => { activeTab = '즐겨찾기'; render(); };
    tabsEl.appendChild(favTabBtn);
  }
  if(transferCount > 0){
    const moveBtn = document.createElement('button');
    moveBtn.className = 'tab tab-transfer' + (activeTab === '인사이동자' ? ' active' : '');
    moveBtn.textContent = `인사이동자 ${transferCount}`;
    moveBtn.onclick = () => { activeTab = '인사이동자'; render(); };
    tabsEl.appendChild(moveBtn);
  }
  depts.forEach(d => {
    const b = document.createElement('button');
    b.className = 'tab' + (activeTab === d ? ' active' : '');
    b.textContent = d;
    b.onclick = () => { activeTab = d; render(); };
    tabsEl.appendChild(b);
  });
}

function renderDeptOptions(){
  const depts = getDepartments(adminMode ? getWorkingList() : contacts);
  fDept.innerHTML = '<option value="">-- 선택 --</option>' +
    depts.map(d => `<option value="${escapeAttr(d)}">${escapeHtml(d)}</option>`).join('') +
    '<option value="__new__">+ 새 부서 입력</option>';
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function matchesSearch(c, term){
  if(!term) return true;
  const t = term.toLowerCase();
  return (c.name||'').toLowerCase().includes(t) || (c.duty||'').toLowerCase().includes(t);
}

function highlightMatch(text, term){
  if(!term) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + term.length);
  const after = text.slice(idx + term.length);
  return `${escapeHtml(before)}<span class="search-hit">${escapeHtml(match)}</span>${escapeHtml(after)}`;
}

function colorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash << 5) - hash); }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function render(){
  updateWrapState();
  renderTabs();
  const searching = searchTerm.trim() !== '';
  utilityRow.style.display = (searching && !browseMode) ? 'none' : '';
  browseToggle.textContent = browseMode ? '☰ 과별 보기 닫기' : '☰ 과별로 보기';
  browseToggle.style.display = browseMode ? 'none' : '';
  favToggle.style.display = !browseMode ? '' : 'none';
  browseExitFixed.style.display = browseMode ? '' : 'none';
  browseExitFixed.textContent = activeTab === '즐겨찾기' ? '즐겨찾기 닫기' : '과별 보기 닫기';
  browseExitFixed.classList.toggle('stacked', adminMode);
  archiveToggle.style.display = 'none'; // 아카이브 기능 임시 비활성화
  openAddBtn.style.display = adminMode ? '' : 'none';
  adminFooter.style.display = (isActiveView() || adminMode) ? 'none' : '';
  adminExit.style.display = adminMode ? '' : 'none';

  adminBar.style.display = adminMode ? 'flex' : 'none';
  if(adminMode){
    adminCurrentBaseDate.textContent = '현재 기준일 : ' + formatRefDate(baseDate);
    promoteBaseDate.style.display = (adminWorkingDate && adminWorkingDate !== baseDate) ? '' : 'none';
  }

  if(!adminMode){
    archiveBanner.style.display = 'flex';
    const refDate = archiveDate || baseDate;
    archiveBannerText.textContent = '기준일 : ' + formatRefDate(refDate);
    archiveExit.style.display = archiveDate ? '' : 'none';
  }else{
    archiveBanner.style.display = 'none';
  }

  listArea.innerHTML = '';

  if(!isActiveView()){
    return;
  }

  const sourceList = effectiveContacts();
  let filtered = sourceList.filter(c => matchesSearch(c, searchTerm));

  const changedMap = {};
  getChangedPeople().forEach(c => { changedMap[c.id] = c; });

  if(browseMode && activeTab === '인사이동자'){
    filtered = filtered.filter(c => changedMap[c.id] && changedMap[c.id].changeType === 'transfer');
  }else if(browseMode && activeTab === '즐겨찾기'){
    filtered = filtered.filter(c => favorites.has(c.id));
    const deptOrder = getDepartments(sourceList);
    filtered = filtered.slice().sort((a, b) => deptOrder.indexOf(a.dept) - deptOrder.indexOf(b.dept));
  }else if(browseMode && activeTab !== '전체'){
    filtered = filtered.filter(c => c.dept === activeTab);
  }

  if(filtered.length === 0){
    listArea.innerHTML = '<div class="empty">검색 결과가 없습니다. 다른 이름이나 업무로 검색해보세요.</div>';
    return;
  }

  const groupByDept = browseMode && activeTab === '전체';
  if(!groupByDept){
    listArea.appendChild(renderCards(filtered, changedMap));
    return;
  }

  const groups = {};
  filtered.forEach(c => {
    const key = c.dept || '미지정';
    if(!groups[key]) groups[key] = [];
    groups[key].push(c);
  });
  const deptKeys = getDepartments(filtered);
  if(groups['미지정']) deptKeys.push('미지정');
  deptKeys.forEach(dept => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = dept;
    listArea.appendChild(label);
    listArea.appendChild(renderCards(groups[dept], changedMap));
  });
}

function renderCards(list, changedMap){
  changedMap = changedMap || {};
  const frag = document.createDocumentFragment();
  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const isNew = c.updatedAt && (Date.now() - c.updatedAt) < NEW_THRESHOLD_MS;
    const phoneShort = (c.phone||'').replace('051-', '').replace('052-', '');
    const change = changedMap[c.id];
    const changeBadge = change
      ? `<button type="button" class="change-badge" data-id="${escapeAttr(c.id)}">변동됨</button>`
      : '';
    const phoneEl = adminMode
      ? `<span class="phone-link phone-link-disabled">${escapeHtml(phoneShort)}</span>`
      : `<a class="phone-link" href="tel:${escapeAttr((c.phone||'').replace(/[^0-9+]/g,''))}">${escapeHtml(phoneShort)}</a>`;
    const nameTag = adminMode ? 'button' : 'span';
    const nameAttrs = adminMode ? 'type="button" class="name name-editable"' : 'class="name"';
    const isFav = favorites.has(c.id);
    const favBtn = `<button type="button" class="fav-btn${isFav ? ' active' : ''}" data-id="${escapeAttr(c.id)}" aria-label="즐겨찾기">${isFav ? '★' : '☆'}</button>`;
    const cardBody = `
      ${favBtn}
      <div class="left">
        <div class="name-row">
          <${nameTag} ${nameAttrs}>${highlightMatch(c.name, searchTerm.trim())}</${nameTag}>
          <span class="dept">${escapeHtml(c.dept)}</span>
          ${changeBadge}
        </div>
        ${c.duty ? `<div class="duty">${highlightMatch(c.duty, searchTerm.trim())}</div>` : ''}
      </div>
      <div class="phone-col">
        ${phoneEl}
      </div>
    `;

    if(adminMode && !archiveDate){
      card.innerHTML = `
        <button type="button" class="card-delete-btn">삭제</button>
        <div class="card-body">${cardBody}</div>
      `;
      const nameBtn = card.querySelector('.name-editable');
      if(nameBtn){
        nameBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if(card.classList.contains('revealed')) return; // 열려있을 때는 닫기만
          showConfirm(`${c.name}님의 연락처를 수정하시겠습니까?`, () => openEdit(c.id));
        });
      }
      const deleteBtn = card.querySelector('.card-delete-btn');
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showConfirm(`${c.name}님의 연락처를 삭제하시겠습니까?`, () => deleteContact(c.id));
      });
      attachSwipe(card, c);
    }else{
      card.innerHTML = `<div class="card-body">${cardBody}</div>`;
    }

    if(change){
      const badgeEl = card.querySelector('.change-badge');
      if(badgeEl){
        badgeEl.addEventListener('click', (e) => {
          e.stopPropagation();
          openChangeInfo(change);
        });
      }
    }
    const favEl = card.querySelector('.fav-btn');
    if(favEl){
      favEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(c.id);
      });
    }
    frag.appendChild(card);
  });
  return frag;
}

let openSwipeCard = null;

function attachSwipe(card, contact){
  const body = card.querySelector('.card-body');
  const REVEAL = 88;
  let startX = 0, startY = 0, dx = 0, dragging = false, baseX = 0;

  function setOpen(open){
    card.classList.toggle('revealed', open);
    body.style.transform = open ? `translateX(${REVEAL}px)` : '';
    if(open){
      if(openSwipeCard && openSwipeCard !== card) openSwipeCard.classList.contains('revealed') && closeSwipeCard(openSwipeCard);
      openSwipeCard = card;
    }else if(openSwipeCard === card){
      openSwipeCard = null;
    }
  }

  body.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; dragging = true;
    baseX = card.classList.contains('revealed') ? REVEAL : 0;
    dx = baseX;
    body.style.transition = 'none';
    body.setPointerCapture(e.pointerId);
  });
  body.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    const rawDx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 60){ dragging = false; body.style.transition = ''; body.style.transform = baseX ? `translateX(${baseX}px)` : ''; return; }
    dx = Math.max(0, Math.min(REVEAL, baseX + rawDx));
    body.style.transform = `translateX(${dx}px)`;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    body.style.transition = '';
    const wasTap = Math.abs(dx - baseX) < 4;
    if(wasTap){
      if(baseX === 0){
        // 닫힌 상태에서 탭: name 버튼 자체의 클릭 핸들러가 처리하므로 여기서는 아무것도 안 함
        body.style.transform = '';
      }else{
        // 열린 상태에서 탭: 닫기
        setOpen(false);
      }
      return;
    }
    if(dx > REVEAL / 2){
      setOpen(true);
    }else{
      setOpen(false);
    }
  }
  body.addEventListener('pointerup', endDrag);
  body.addEventListener('pointercancel', endDrag);
}

function closeSwipeCard(card){
  const body = card.querySelector('.card-body');
  card.classList.remove('revealed');
  if(body) body.style.transform = '';
  if(openSwipeCard === card) openSwipeCard = null;
}

function attachTabSwipe(){
  let startX = 0, startY = 0, dragging = false;
  const THRESHOLD = 70;

  listArea.addEventListener('pointerdown', (e) => {
    if(!browseMode || activeTab === '전체') return;
    if(e.target.closest('.card')) return; // 카드 자체 스와이프(수정/삭제)와 겹치지 않도록
    startX = e.clientX; startY = e.clientY; dragging = true;
  });
  listArea.addEventListener('pointerup', (e) => {
    if(!dragging) return;
    dragging = false;
    if(!browseMode || activeTab === '전체') return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 60 || Math.abs(dx) < THRESHOLD) return;
    const depts = getDepartments(effectiveContacts());
    const favCount = effectiveContacts().filter(c => favorites.has(c.id)).length;
    const specialTabs = [
      ...(favCount ? ['즐겨찾기'] : []),
      ...(getChangedPeople().length ? ['인사이동자'] : [])
    ];
    const allTabs = [...specialTabs, ...depts];
    const idx = allTabs.indexOf(activeTab);
    if(idx === -1) return;
    if(dx < 0 && idx < allTabs.length - 1){
      activeTab = allTabs[idx + 1];
      render();
    }else if(dx > 0 && idx > 0){
      activeTab = allTabs[idx - 1];
      render();
    }
  });
  listArea.addEventListener('pointercancel', () => { dragging = false; });
}

function openAdd(){
  modalTitle.textContent = '연락처 추가';
  editId.value = '';
  fName.value = '';
  fDuty.value = '';
  fPhone.value = '';
  fNote.value = '';
  renderDeptOptions();
  fDept.value = '';
  fDeptNew.style.display = 'none';
  fDeptNew.value = '';
  overlay.classList.add('open');
  fName.focus();
}

function openEdit(id){
  const c = getWorkingList().find(x => x.id === id);
  if(!c) return;
  modalTitle.textContent = '연락처 수정';
  editId.value = id;
  fName.value = c.name || '';
  fDuty.value = c.duty || '';
  fPhone.value = c.phone || '';
  fNote.value = c.note || '';
  renderDeptOptions();
  fDept.value = c.dept || '';
  fDeptNew.style.display = 'none';
  fDeptNew.value = '';
  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

function deleteContact(id){
  const list = getWorkingList();
  const c = list.find(x => x.id === id);
  if(!c) return;
  commitWorkingList(list.filter(x => x.id !== id));
  render();
  showToast('삭제되었습니다');
}

function saveContact(){
  const name = fName.value.trim();
  let dept = fDept.value;
  if(dept === '__new__'){
    dept = fDeptNew.value.trim();
  }
  const duty = fDuty.value.trim();
  const phone = fPhone.value.trim();
  const note = fNote.value.trim();

  if(!name || !dept || !phone){
    showToast('이름, 부서, 전화번호는 필수입니다');
    return;
  }

  const id = editId.value;
  const now = Date.now();
  const list = getWorkingList();
  let updatedList;
  if(id){
    updatedList = list.map(c => c.id === id ? {...c, name, dept, duty, phone, note, updatedAt: now} : c);
    showToast('수정되었습니다');
  }else{
    updatedList = [...list, { id: 'c' + now, name, dept, duty, phone, note, updatedAt: now }];
    showToast('추가되었습니다');
  }
  commitWorkingList(updatedList);
  closeModal();
  render();
}

function openDatePicker(mode){
  archiveModalTitle.textContent = mode === 'admin' ? '기준일 관리' : '기준일 변경';
  const arc = loadArchive();
  if(!arc[baseDate]) arc[baseDate] = contacts; // 기준일 항목이 없으면 현재 데이터로 보정
  const dates = Object.keys(arc).sort((a,b)=> b.localeCompare(a));

  yearChips.innerHTML = '';
  archiveList.innerHTML = '';

  if(dates.length === 0){
    const empty = document.createElement('div');
    empty.className = 'archive-empty';
    empty.innerHTML = '아직 저장된 기록이 없습니다.<br>연락처가 수정되면 날짜별로 자동 저장됩니다.';
    archiveList.appendChild(empty);
    archiveOverlay.classList.add('open');
    return;
  }

  const byYear = {};
  dates.forEach(d => {
    const y = d.slice(0,4);
    (byYear[y] = byYear[y] || []).push(d);
  });
  const years = Object.keys(byYear).sort((a,b)=> b.localeCompare(a));
  let selectedDate = mode === 'admin' ? baseDate : (archiveDate || baseDate);
  let selectedYear = years.includes(selectedDate.slice(0,4)) ? selectedDate.slice(0,4) : years[0];

  function selectDateView(d){
    // 보기 모드: 바로 그 날짜 데이터를 보여줌
    archiveDate = (d === baseDate) ? null : d;
    searchTerm = '';
    searchInput.value = '';
    searchClear.classList.remove('show');
    browseMode = false;
    activeTab = '전체';
    archiveOverlay.classList.remove('open');
    render();
  }

  function doEdit(){
    adminWorkingDate = selectedDate;
    archiveOverlay.classList.remove('open');
    render();
  }

  function doDelete(){
    if(selectedDate === baseDate){
      showToast('현재 기준일은 삭제할 수 없습니다. 다른 날짜를 기준일로 지정한 뒤 삭제해주세요.');
      return;
    }
    showConfirm('삭제하시겠습니까?', () => {
      const arc2 = loadArchive();
      delete arc2[selectedDate];
      try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc2)); }catch(e){}
      if(adminWorkingDate === selectedDate) adminWorkingDate = baseDate;
      showToast(formatDateLabel(selectedDate) + ' 기록을 삭제했습니다');
      archiveOverlay.classList.remove('open');
      render();
    });
  }

  function doAdd(){
    archiveList.innerHTML = '';
    const backBtn = document.createElement('button');
    backBtn.className = 'add-date-back';
    backBtn.textContent = '뒤로가기';
    backBtn.onclick = () => renderSelectView();
    archiveList.appendChild(backBtn);
    archiveList.appendChild(buildAddDateSection());
  }

  const dateListWrap = document.createElement('div');
  const actionRow = document.createElement('div');
  actionRow.className = 'archive-action-row';

  function renderDateList(){
    dateListWrap.innerHTML = '';
    byYear[selectedYear].forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'archive-item' + (d === selectedDate ? ' today' : '');
      btn.textContent = formatDateLabel(d);
      if(mode === 'admin'){
        btn.onclick = () => {
          selectedDate = d;
          renderDateList();
        };
      }else{
        btn.onclick = () => selectDateView(d);
      }
      dateListWrap.appendChild(btn);
    });
  }

  function renderSelectView(){
    archiveList.innerHTML = '';
    archiveList.appendChild(dateListWrap);
    if(mode === 'admin'){
      archiveList.appendChild(actionRow);
    }
    renderDateList();

function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('script load failed: ' + src));
    document.head.appendChild(s);
  });
}

async function ensurePdfJs(){
  if(window.pdfjsLib) return;
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extractPdfLines(file){
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for(let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const rows = {};
    content.items.forEach(it => {
      const y = Math.round(it.transform[5] / 3) * 3; // 비슷한 높이는 같은 줄로 묶음
      (rows[y] = rows[y] || []).push({ x: it.transform[4], str: it.str });
    });
    Object.keys(rows)
      .map(Number)
      .sort((a, b) => b - a)
      .forEach(y => {
        const lineText = rows[y]
          .sort((a, b) => a.x - b.x)
          .map(s => s.str)
          .join(' ')
          .replace(/\s+/g, ' ')
          .trim();
        if(lineText) lines.push(lineText);
      });
  }
  return lines;
}

async function ensureTesseract(){
  if(window.Tesseract) return;
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js');
}

async function extractImageLines(file){
  await ensureTesseract();
  const result = await window.Tesseract.recognize(file, 'kor+eng');
  const text = (result && result.data && result.data.text) || '';
  return text.split('\n').map(l => l.trim()).filter(Boolean);
}

function parseLineToContact(line){
  const phoneMatch = line.match(/(0\d{1,2}-\d{3,4}-\d{4}|\d{3,4}-\d{4})/);
  if(!phoneMatch) return null;
  let phone = phoneMatch[0];
  if(!phone.startsWith('0')) phone = '051-' + phone;
  const rest = line.replace(phoneMatch[0], '').trim();
  const tokens = rest.split(/\s+/).filter(Boolean);
  const dept = tokens[0] || '';
  const name = tokens[1] || '';
  const duty = tokens.slice(2).join(' ') || '';
  return { id: 'r' + Math.random().toString(36).slice(2, 9), dept, name, duty, phone, note: '' };
}

function openPdfReview(dateVal, rows, onCancel){
  pdfReviewTitle.textContent = formatRefDate(dateVal) + ' — PDF 인식 결과 검토';
  const state = rows.map(r => ({...r}));

  function renderRows(){
    pdfReviewList.innerHTML = '';
    state.forEach((r, idx) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'pdf-review-row';
      rowEl.innerHTML = `
        <input type="text" data-field="dept" placeholder="부서" value="${escapeAttr(r.dept)}">
        <input type="text" data-field="name" placeholder="이름" value="${escapeAttr(r.name)}">
        <input type="text" data-field="duty" placeholder="업무" value="${escapeAttr(r.duty)}">
        <input type="text" class="pdf-row-phone" data-field="phone" placeholder="전화번호" value="${escapeAttr(r.phone)}">
        <button type="button" class="pdf-row-del">삭제</button>
      `;
      rowEl.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          state[idx][inp.dataset.field] = inp.value;
        });
      });
      rowEl.querySelector('.pdf-row-del').addEventListener('click', () => {
        state.splice(idx, 1);
        renderRows();
      });
      pdfReviewList.appendChild(rowEl);
    });
  }
  renderRows();

  pdfReviewOverlay.classList.add('open');

  const cancelBtn = document.getElementById('pdfReviewCancel');
  const saveBtn = document.getElementById('pdfReviewSave');
  const newCancelBtn = cancelBtn.cloneNode(true);
  const newSaveBtn = saveBtn.cloneNode(true);
  cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);
  saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn);

  newCancelBtn.addEventListener('click', () => {
    pdfReviewOverlay.classList.remove('open');
    if(onCancel) onCancel();
  });
  newSaveBtn.addEventListener('click', () => {
    const cleaned = state
      .filter(r => r.name && r.phone)
      .map(r => ({ id: r.id, name: r.name, dept: r.dept, duty: r.duty, phone: r.phone, note: '', updatedAt: Date.now() }));
    if(cleaned.length === 0){
      showToast('저장할 데이터가 없습니다');
      return;
    }
    const arc = loadArchive();
    arc[dateVal] = cleaned;
    try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc)); }catch(e){}
    adminWorkingDate = dateVal;
    pdfReviewOverlay.classList.remove('open');
    showToast(formatRefDate(dateVal) + ' 데이터를 PDF에서 생성했습니다');
    render();
  });
}

const AUTO_BACKUP_DATE_KEY = 'busan-ulsan-mma-lastbackup-v1';

function buildBackupPayload(){
  return {
    exportedAt: new Date().toISOString(),
    baseDate: baseDate,
    contacts: contacts,
    archive: loadArchive()
  };
}

let googleAccessToken = null;
let googleTokenClient = null;

function ensureGoogleAuth(){
  return new Promise((resolve, reject) => {
    if(!GOOGLE_CLIENT_ID){
      reject(new Error('구글 클라이언트 ID가 설정되지 않았습니다'));
      return;
    }
    loadScriptOnce('https://accounts.google.com/gsi/client').then(() => {
      if(!googleTokenClient){
        googleTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: GOOGLE_CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (response) => {
            if(response && response.access_token){
              googleAccessToken = response.access_token;
              resolve(googleAccessToken);
            }else{
              reject(new Error('구글 인증에 실패했습니다'));
            }
          }
        });
      }
      googleTokenClient.requestAccessToken({ prompt: googleAccessToken ? '' : 'consent' });
    }).catch(reject);
  });
}

async function backupToGoogleDrive(){
  if(!GOOGLE_CLIENT_ID){
    showToast('구글 드라이브 연동이 아직 설정되지 않았습니다');
    return;
  }
  try{
    await ensureGoogleAuth();
    const payload = buildBackupPayload();
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    const fileName = `병무청전화번호부_백업_${y}${m}${d}.json`;
    const metadata = { name: fileName, mimeType: 'application/json' };
    const boundary = '-------314159265358979323846';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload, null, 2)}\r\n` +
      `--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + googleAccessToken,
        'Content-Type': `multipart/related; boundary=${boundary}`
      },
      body
    });
    if(res.ok){
      showToast('구글 드라이브에 백업했습니다');
    }else if(res.status === 401){
      googleAccessToken = null;
      showToast('인증이 만료됐습니다. 다시 시도해주세요');
    }else{
      showToast('구글 드라이브 백업에 실패했습니다');
    }
  }catch(e){
    showToast('구글 드라이브 연동 중 오류가 발생했습니다');
  }
}

function downloadBackupFile(){
  try{
    const payload = buildBackupPayload();
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `병무청전화번호부_백업_${y}${m}${d}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    return true;
  }catch(e){
    return false;
  }
}

function autoBackupIfNeeded(){
  try{
    const today = new Date();
    const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
    const todayKey = `${y}-${m}-${d}`;
    const lastBackup = localStorage.getItem(AUTO_BACKUP_DATE_KEY);
    if(lastBackup === todayKey) return;
    if(downloadBackupFile()){
      localStorage.setItem(AUTO_BACKUP_DATE_KEY, todayKey);
      showToast('오늘의 자동 백업 파일을 저장했습니다');
    }
  }catch(e){
    // 자동 백업 실패는 조용히 무시
  }
}

function restoreFromBackupFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.contacts)){
        showToast('올바른 백업 파일이 아닙니다');
        return;
      }
      showConfirm('백업 파일로 복원하시겠습니까? 현재 데이터를 덮어씁니다.', () => {
        contacts = data.contacts;
        saveContacts(contacts);
        if(data.archive && typeof data.archive === 'object'){
          try{ localStorage.setItem(ARCHIVE_KEY, JSON.stringify(data.archive)); }catch(e){}
        }
        if(data.baseDate){
          baseDate = data.baseDate;
          saveBaseDate(baseDate);
        }
        adminWorkingDate = baseDate;
        showToast('백업 파일로 복원했습니다');
        render();
      });
    }catch(e){
      showToast('백업 파일을 읽는 중 오류가 발생했습니다');
    }
  };
  reader.readAsText(file);
}

let lockedScrollY = 0;
function syncModalScrollLock(){
  const anyOpen = !!document.querySelector('.overlay.open');
  const isLocked = document.body.classList.contains('modal-open');
  if(anyOpen && !isLocked){
    lockedScrollY = window.scrollY;
    document.body.style.top = -lockedScrollY + 'px';
    document.body.classList.add('modal-open');
  }else if(!anyOpen && isLocked){
    document.body.classList.remove('modal-open');
    document.body.style.top = '';
    window.scrollTo(0, lockedScrollY);
  }
}
document.querySelectorAll('.overlay').forEach(el => {
  new MutationObserver(syncModalScrollLock).observe(el, { attributes:true, attributeFilter:['class'] });
});
syncModalScrollLock();

function resetZoom(){
  const viewport = document.querySelector('meta[name="viewport"]');
  if(!viewport) return;
  const original = viewport.getAttribute('content');
  viewport.setAttribute('content', original + ', maximum-scale=1.0');
  setTimeout(() => { viewport.setAttribute('content', original); }, 350);
}
