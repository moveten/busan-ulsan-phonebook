<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1f2e">
<meta name="description" content="부산울산지방병무청 직원 연락처 검색 및 관리 앱">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="병무청 전화번호부">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>부산울산지방병무청 전화번호부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8FC;
    --surface:#FFFFFF;
    --ink:#1B2130;
    --ink-soft:#7A8296;
    --primary:#3B5BFF;
    --primary-soft:#E8ECFF;
    --primary-deep:#2743D6;
    --mint:#00C2A8;
    --coral:#FF8B6B;
    --line:#EAEDF4;
    --danger:#EF5B5B;
    --shadow: 0 4px 16px rgba(30,41,80,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12141C;
      --surface:#1C1F2B;
      --ink:#EDEFF7;
      --ink-soft:#9299AC;
      --primary:#7C93FF;
      --primary-soft:#232A47;
      --primary-deep:#AEBBFF;
      --mint:#3DDCC4;
      --coral:#FFA485;
      --line:#2A2E3D;
      --danger:#FF7A7A;
      --shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141C;
    --surface:#1C1F2B;
    --ink:#EDEFF7;
    --ink-soft:#9299AC;
    --primary:#7C93FF;
    --primary-soft:#232A47;
    --primary-deep:#AEBBFF;
    --mint:#3DDCC4;
    --coral:#FFA485;
    --line:#2A2E3D;
    --danger:#FF7A7A;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:16vh 20px 60px;
    min-height:100vh;
    transition:padding 0.25s ease;
  }
  .wrap.active{
    padding-top:32px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
    margin-bottom:26px;
    transition:margin 0.25s ease, justify-content 0.25s ease;
  }
  .wrap.active .brand{
    justify-content:flex-start;
    margin-bottom:18px;
  }
  .brand-dot{
    width:30px;
    height:30px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--primary), var(--mint));
    flex-shrink:0;
  }
  h1{
    font-weight:800;
    font-size:1.25rem;
    margin:0;
    color:var(--ink);
    letter-spacing:-0.01em;
  }

  .searchbar{
    position:relative;
  }
  .searchbar input{
    width:100%;
    padding:15px 50px 15px 46px;
    font-size:1rem;
    font-family:inherit;
    border:1.5px solid var(--line);
    border-radius:16px;
    background:var(--surface);
    color:var(--ink);
    box-shadow:var(--shadow);
  }
  .searchbar input::placeholder{ color:var(--ink-soft); }
  .searchbar input:focus-visible{
    outline:none;
    border-color:var(--primary);
  }
  .searchbar::before{
    content:"";
    position:absolute;
    left:18px;
    top:50%;
    width:15px;
    height:15px;
    transform:translateY(-50%);
    border:2px solid var(--primary);
    border-radius:50%;
    box-shadow: 7px 7px 0 -3px var(--primary);
  }
  .searchbar .clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border:none;
    border-radius:50%;
    background:var(--bg-card);
    color:var(--ink-soft);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .searchbar .clear-btn.show{ display:flex; }
  .searchbar .clear-btn:hover{ color:var(--ink); }

  .utility-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:16px;
  }
  .wrap.active .utility-row{
    justify-content:flex-start;
  }
  .utility-row button{
    cursor:pointer;
    font-family:inherit;
    font-size:0.95rem;
    font-weight:700;
    padding:13px 20px;
    border-radius:16px;
    border:none;
    background:var(--primary-soft);
    color:var(--primary-deep);
    flex:1;
    transition:transform 0.12s ease, opacity 0.12s ease;
  }
  @media (min-width:480px){
    .utility-row button{ flex:0 0 auto; }
  }
  .utility-row button:active{ transform:scale(0.97); }
  .utility-row button.primary{
    background:var(--primary);
    color:#fff;
    box-shadow:0 6px 16px rgba(59,91,255,0.28);
  }
  .utility-row button:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
  }

  .browse-exit-fixed{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:9;
    cursor:pointer;
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    padding:13px 26px;
    border-radius:24px;
    border:none;
    background:var(--ink);
    color:var(--bg);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
  }
  .browse-exit-fixed:active{ transform:translateX(-50%) scale(0.96); }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 6px;
    margin:20px 0 6px;
  }
  .tabs::-webkit-scrollbar{ height:0; }
  .tab{
    flex:0 0 auto;
    padding:9px 16px;
    font-size:0.85rem;
    font-weight:600;
    color:var(--ink-soft);
    background:var(--surface);
    border:1.5px solid var(--line);
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    color:#fff;
    background:var(--primary);
    border-color:var(--primary);
  }
  .tab-transfer{
    color:var(--coral);
    border-color:var(--coral);
  }
  .tab-transfer.active{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }
  .tab:focus-visible{
    outline:2px solid var(--primary);
    outline-offset:2px;
  }

  .section-label{
    margin:24px 2px 10px;
    color:var(--ink-soft);
    font-size:0.78rem;
    font-weight:700;
  }
  .section-label:first-child{ margin-top:6px; }

  .card{
    background:var(--surface);
    border:0.5px solid var(--border-soft);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:8px;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:12px;
  }
  .card .left{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .card .name-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .card .name{
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    white-space:nowrap;
  }
  .card .dept{
    font-size:12px;
    font-weight:800;
    color:var(--primary);
    background:var(--primary-soft);
    padding:3px 10px;
    border-radius:8px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .change-badge{
    font-family:inherit;
    font-size:11px;
    font-weight:800;
    border:none;
    border-radius:8px;
    padding:3px 9px;
    white-space:nowrap;
    flex-shrink:0;
    cursor:pointer;
  }
  .change-transfer{
    background:var(--coral);
    color:#fff;
  }
  .change-duty{
    background:var(--mint);
    color:#0A2E28;
  }
  .card .duty{
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    line-height:1.5;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
  }
  .search-hit{
    background:transparent;
    color:var(--coral);
    border-radius:0;
    padding:0;
    font-weight:800;
  }
  .new-badge{
    display:inline-flex;
    align-items:center;
    gap:2px;
    background:var(--coral);
    color:#fff;
    font-size:0.68rem;
    font-weight:800;
    padding:2px 8px;
    border-radius:9px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .card .meta{
    margin-top:2px;
    font-size:0.8rem;
    color:var(--ink-soft);
  }
  .card .phone-col{
    flex-shrink:0;
    align-self:stretch;
    display:flex;
    align-items:center;
    padding-left:12px;
    border-left:1px solid var(--border-soft);
  }
  .card a.phone-link{
    color:var(--ink);
    background:transparent;
    text-decoration:none;
    font-weight:700;
    font-size:19px;
    padding:0;
    white-space:nowrap;
  }
  .card-actions{ display:none; }

  .card{ touch-action:pan-y; user-select:none; position:relative; }
  .card.dragging{ transition:none; }

  .admin-footer{
    position:fixed;
    left:0;
    right:0;
    bottom:14px;
    display:flex;
    justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events:none;
  }
  .admin-footer button{
    pointer-events:auto;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:0.78rem;
    font-family:inherit;
    cursor:pointer;
    padding:6px 10px;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .admin-footer button:hover{ color:var(--primary); }
  .admin-footer button.on{ color:var(--mint); font-weight:700; }

  .modal.small{ max-width:340px; }
  .modal p.confirm-msg{
    font-size:0.95rem;
    color:var(--ink);
    margin:0 0 4px;
    text-align:center;
    padding:10px 0 4px;
  }

  .archive-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--primary-soft);
    color:var(--primary-deep);
    border-radius:14px;
    padding:12px 14px;
    margin-top:14px;
    font-size:0.85rem;
    font-weight:600;
  }
  .archive-banner-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .archive-banner button{
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:7px 12px;
    font-size:0.78rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    flex-shrink:0;
  }
  .archive-banner #archiveExit{
    background:transparent;
    color:var(--primary-deep);
    border:1.5px solid var(--primary);
  }

  .admin-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
  }
  .admin-bar button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:12px;
    font-size:0.82rem;
    font-weight:700;
    padding:9px 14px;
  }
  #adminDateChip{
    background:var(--mint);
    color:#0A2E28;
  }
  #adminExit{
    background:transparent;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:3px;
    padding:9px 4px;
  }
  #adminExit:hover{ color:var(--danger); }

  .archive-item{
    width:100%;
    text-align:left;
    padding:13px 14px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--bg);
    color:var(--ink);
    font-size:0.92rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    margin-bottom:8px;
  }
  .archive-item:hover{ border-color:var(--primary); }
  .archive-item .archive-item-sub{
    display:block;
    font-size:0.76rem;
    font-weight:500;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .archive-item.today{ border-color:var(--primary); background:var(--primary-soft); }
  .year-chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:6px;
  }
  .year-chip{
    flex-shrink:0;
    font-family:inherit;
    cursor:pointer;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    font-size:0.85rem;
    font-weight:700;
    padding:8px 16px;
    border-radius:12px;
  }
  .year-chip.active{
    border-color:var(--primary);
    background:var(--primary);
    color:#fff;
  }
  .archive-date-list{
    max-height:320px;
    overflow-y:auto;
  }
  .archive-empty{
    color:var(--ink-soft);
    font-size:0.88rem;
    text-align:center;
    padding:18px 4px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:0.88rem;
  }

  /* modal */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,24,40,0.4);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{ display:flex; }
  @media (min-width:600px){
    .overlay{ align-items:center; }
  }
  #adminOverlay{
    align-items:center;
  }
  #adminOverlay .modal{
    border-radius:22px;
    margin-top:10vh;
  }
  .modal{
    background:var(--surface);
    width:100%;
    max-width:440px;
    border-radius:22px 22px 0 0;
    padding:24px 22px 26px;
    max-height:88vh;
    overflow-y:auto;
  }
  @media (min-width:600px){
    .modal{ border-radius:22px; }
  }
  .modal h2{
    font-size:1.15rem;
    font-weight:800;
    margin:0 0 18px;
    color:var(--ink);
  }
  .field{ margin-bottom:13px; }
  .field label{
    display:block;
    font-size:0.78rem;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:11px 12px;
    font-size:0.92rem;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
  }
  .field input:focus-visible, .field select:focus-visible{
    outline:none;
    border-color:var(--primary);
  }
  .field .newdept{
    margin-top:8px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:20px;
  }
  .modal-actions button{
    flex:1;
    padding:13px;
    border-radius:14px;
    font-size:0.92rem;
    font-weight:700;
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    cursor:pointer;
    font-family:inherit;
  }
  .modal-actions button.primary{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--bg);
    padding:11px 20px;
    border-radius:24px;
    font-size:0.83rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:20;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">
    <div class="brand-dot"></div>
    <h1>부산울산지방병무청 전화번호부</h1>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="이름 또는 업무로 검색" autofocus>
    <button type="button" id="searchClear" class="clear-btn" aria-label="검색어 지우기">✕</button>
  </div>

  <div class="archive-banner" id="archiveBanner">
    <span id="archiveBannerText"></span>
    <div class="archive-banner-actions">
      <button id="archiveDateChange">변경</button>
      <button id="archiveExit" style="display:none;">오늘로</button>
    </div>
  </div>

  <div class="admin-bar" id="adminBar" style="display:none;">
    <button id="adminDateChip">📅 오늘</button>
    <button id="adminExit">관리자 모드 종료</button>
  </div>

  <div class="utility-row">
    <button id="browseToggle">과별로 보기</button>
    <button id="archiveToggle" style="display:none;">아카이브</button>
    <button id="openAdd" class="primary" style="display:none;">+ 연락처 추가</button>
  </div>

  <div class="tabs" id="tabs" style="display:none;"></div>

  <div id="listArea"></div>
</div>

<button id="browseExitFixed" class="browse-exit-fixed" style="display:none;">과별 보기 닫기</button>

<div class="admin-footer">
  <button id="adminToggle">관리자 모드로 들어가기</button>
</div>

<div class="overlay" id="adminOverlay">
  <div class="modal small">
    <h2>관리자 모드</h2>
    <div class="field">
      <label for="adminPassword">비밀번호</label>
      <input type="password" id="adminPassword" placeholder="비밀번호 입력">
    </div>
    <div class="modal-actions">
      <button id="adminCancel">취소</button>
      <button class="primary" id="adminOk">확인</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="modal small">
    <p class="confirm-msg" id="confirmMessage"></p>
    <div class="modal-actions">
      <button id="confirmCancel">취소</button>
      <button class="primary" id="confirmOk">확인</button>
    </div>
  </div>
</div>

<div class="overlay" id="archiveOverlay">
  <div class="modal small">
    <h2 id="archiveModalTitle">기준일 변경</h2>
    <div class="year-chips" id="yearChips"></div>
    <div id="archiveList"></div>
    <div class="modal-actions">
      <button id="archiveCancel">닫기</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">연락처 추가</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label for="fName">이름 *</label>
      <input type="text" id="fName" placeholder="홍길동">
    </div>
    <div class="field">
      <label for="fDept">과 / 부서 *</label>
      <select id="fDept">
        <option value="">-- 선택 --</option>
        <option value="__new__">+ 새 부서 입력</option>
      </select>
      <input type="text" id="fDeptNew" class="newdept" placeholder="새 부서명 입력" style="display:none;">
    </div>
    <div class="field">
      <label for="fDuty">담당 업무</label>
      <input type="text" id="fDuty" placeholder="예: 병력동원훈련소집">
    </div>
    <div class="field">
      <label for="fPhone">전화번호 *</label>
      <input type="text" id="fPhone" placeholder="051-000-0000">
    </div>
    <div class="field">
      <label for="fNote">비고</label>
      <input type="text" id="fNote" placeholder="선택 입력">
    </div>
    <div class="modal-actions">
      <button id="cancelBtn">취소</button>
      <button class="primary" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'busan-ulsan-mma-contacts-v9';
const ARCHIVE_KEY = 'busan-ulsan-mma-archive-v1';
const AVATAR_COLORS = ['#3B5BFF', '#00C2A8', '#FF8B6B', '#8A5CF6', '#2AB673'];
const NEW_THRESHOLD_MS = 3 * 24 * 60 * 60 * 1000; // 3일 이내 변경분을 "새로 변경됨"으로 표시

const seedData = [

function loadContacts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seedData));
      return [...seedData];
    }
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [...seedData];
  }catch(e){
    return [...seedData];
  }
}

function saveContacts(list){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }catch(e){
    showToast('저장에 실패했습니다');
  }
  snapshotToday(list);
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function formatDateLabel(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const label = `${y}년 ${m}월 ${d}일`;
  return dateStr === todayStr() ? `${label} (오늘, 진행 중)` : label;
}

function formatRefDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return `${y}. ${m}. ${d}.`;
}

function loadArchive(){
  try{
    const raw = localStorage.getItem(ARCHIVE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return (parsed && typeof parsed === 'object') ? parsed : {};
  }catch(e){
    return {};
  }
}

function snapshotToday(list){
  try{
    const arc = loadArchive();
    arc[todayStr()] = list;
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(arc));
  }catch(e){
    // 아카이브 저장 실패는 조용히 무시 (연락처 저장 자체는 이미 완료됨)
  }
}

function getDepartments(list){

  (list||contacts).forEach(c => {

      order.push(c.dept);
    }
  });
  return order;
}

function getPreviousArchiveDate(refDate){
  const arc = loadArchive();
  const dates = Object.keys(arc).filter(d => d < refDate).sort((a,b)=> b.localeCompare(a));
  return dates[0] || null;
}

function getChangedPeople(){
  const refDate = archiveDate || todayStr();
  const prevDate = getPreviousArchiveDate(refDate);
  if(!prevDate) return [];
  const arc = loadArchive();
  const prevList = arc[prevDate] || [];
  const currList = effectiveContacts();
  const prevMap = {};
  prevList.forEach(p => { prevMap[p.id] = p; });
  const changed = [];
  currList.forEach(c => {
    const prev = prevMap[c.id];
    if(!prev) return;
    if(prev.dept !== c.dept){
      changed.push({...c, changeType:'transfer', fromDept: prev.dept, toDept: c.dept});
    }else if((prev.duty||'') !== (c.duty||'')){
      changed.push({...c, changeType:'duty', fromDuty: prev.duty||'(없음)', toDuty: c.duty||'(없음)'});
    }
  });
  return changed;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function matchesSearch(c, term){
  if(!term) return true;
  const t = term.toLowerCase();
  return (c.name||'').toLowerCase().includes(t) || (c.duty||'').toLowerCase().includes(t);
}

function highlightMatch(text, term){
  if(!term) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  const before = text.slice(0, idx);
  const match = text.slice(idx, idx + term.length);
  const after = text.slice(idx + term.length);
  return `${escapeHtml(before)}<span class="search-hit">${escapeHtml(match)}</span>${escapeHtml(after)}`;
}

function colorFor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash << 5) - hash); }
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

    }
    frag.appendChild(card);
  });
  return frag;
}

function attachTabSwipe(){
  let startX = 0, startY = 0, dragging = false;
  const THRESHOLD = 70;

  listArea.addEventListener('pointerdown', (e) => {
    if(!browseMode || activeTab === '전체') return;
    if(e.target.closest('.card')) return; // 카드 자체 스와이프(수정/삭제)와 겹치지 않도록
    startX = e.clientX; startY = e.clientY; dragging = true;
  });
  listArea.addEventListener('pointerup', (e) => {
    if(!dragging) return;
    dragging = false;
    if(!browseMode || activeTab === '전체') return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 60 || Math.abs(dx) < THRESHOLD) return;
    const depts = getDepartments(effectiveContacts());
    const specialTabs = getChangedPeople().length ? ['인사이동자'] : [];
    const allTabs = [...specialTabs, ...depts];
    const idx = allTabs.indexOf(activeTab);
    if(idx === -1) return;
    if(dx < 0 && idx < allTabs.length - 1){
      activeTab = allTabs[idx + 1];
      render();
    }else if(dx > 0 && idx > 0){
      activeTab = allTabs[idx - 1];
      render();
    }
  });
  listArea.addEventListener('pointercancel', () => { dragging = false; });
}

function attachSwipe(card, contact){
  let startX = 0, startY = 0, dx = 0, dragging = false;
  const THRESHOLD = 64;

  card.addEventListener('pointerdown', (e) => {
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', (e) => {
    if(!dragging) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 60){ dragging = false; card.style.transform = ''; return; }
    card.style.transform = `translateX(${dx}px)`;
  });
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    card.style.transform = '';
    if(dx > THRESHOLD){
      showConfirm(`${contact.name}님의 연락처를 수정하시겠습니까?`, () => openEdit(contact.id));
    }else if(dx < -THRESHOLD){
      showConfirm(`${contact.name}님의 연락처를 삭제하시겠습니까?`, () => deleteContact(contact.id));
    }
    dx = 0;
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);
}

  fDeptNew.style.display = 'none';
  fDeptNew.value = '';
  overlay.classList.add('open');
}

function closeModal(){
  overlay.classList.remove('open');
}

function deleteContact(id){
  const list = getWorkingList();
  const c = list.find(x => x.id === id);
  if(!c) return;
  commitWorkingList(list.filter(x => x.id !== id));
  render();
  showToast('삭제되었습니다');
}

function saveContact(){
  const name = fName.value.trim();
  let dept = fDept.value;
  if(dept === '__new__'){
    dept = fDeptNew.value.trim();
  }
  const duty = fDuty.value.trim();
  const phone = fPhone.value.trim();
  const note = fNote.value.trim();

  if(!name || !dept || !phone){
    showToast('이름, 부서, 전화번호는 필수입니다');
    return;
  }

  const id = editId.value;
  const now = Date.now();
  const list = getWorkingList();
  let updatedList;
  if(id){
    updatedList = list.map(c => c.id === id ? {...c, name, dept, duty, phone, note, updatedAt: now} : c);
    showToast('수정되었습니다');
  }else{
    updatedList = [...list, { id: 'c' + now, name, dept, duty, phone, note, updatedAt: now }];
    showToast('추가되었습니다');
  }
  commitWorkingList(updatedList);
  closeModal();
  render();
}

fDept.addEventListener('change', () => {
  fDeptNew.style.display = fDept.value === '__new__' ? 'block' : 'none';
  if(fDept.value === '__new__') fDeptNew.focus();
});

searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  searchClear.classList.toggle('show', searchTerm.length > 0);
  render();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchTerm = '';
  searchClear.classList.remove('show');
  searchInput.focus();
  render();
});

browseToggle.addEventListener('click', () => {
  browseMode = !browseMode;
  if(browseMode) activeTab = '전체';
  render();
});

browseExitFixed.addEventListener('click', () => {
  browseMode = false;
  render();
});

function openDatePicker(mode){
  archiveModalTitle.textContent = mode === 'admin' ? '작업할 날짜 선택' : '기준일 변경';
  const arc = loadArchive();
  if(!arc[todayStr()]) arc[todayStr()] = contacts; // 오늘 항목이 없으면 현재 데이터로 보정
  const dates = Object.keys(arc).sort((a,b)=> b.localeCompare(a));

  if(dates.length === 0){
    yearChips.innerHTML = '';
    archiveList.innerHTML = '<div class="archive-empty">아직 저장된 기록이 없습니다.<br>연락처가 수정되면 날짜별로 자동 저장됩니다.</div>';
    archiveOverlay.classList.add('open');
    return;
  }

  const byYear = {};
  dates.forEach(d => {
    const y = d.slice(0,4);
    (byYear[y] = byYear[y] || []).push(d);
  });
  const years = Object.keys(byYear).sort((a,b)=> b.localeCompare(a));
  const currentRef = mode === 'admin' ? (adminWorkingDate || todayStr()) : (archiveDate || todayStr());
  let selectedYear = years.includes(currentRef.slice(0,4)) ? currentRef.slice(0,4) : years[0];

  function selectDate(d){
    if(mode === 'admin'){
      adminWorkingDate = d;
    }else{
      archiveDate = (d === todayStr()) ? null : d;
      searchTerm = '';
      searchInput.value = '';
      searchClear.classList.remove('show');
      browseMode = false;
      activeTab = '전체';
    }
    archiveOverlay.classList.remove('open');
    render();
  }

  function renderDateList(){
    archiveList.innerHTML = '';
    const listWrap = document.createElement('div');
    listWrap.className = 'archive-date-list';
    byYear[selectedYear].forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'archive-item' + (d === currentRef ? ' today' : '');
      const count = (arc[d]||[]).length;
      btn.innerHTML = `${escapeHtml(formatDateLabel(d))}<span class="archive-item-sub">${count}건 저장됨</span>`;
      btn.onclick = () => selectDate(d);
      listWrap.appendChild(btn);
    });
    archiveList.appendChild(listWrap);
  }

  yearChips.innerHTML = '';
  years.forEach(y => {
    const chip = document.createElement('button');
    chip.className = 'year-chip' + (y === selectedYear ? ' active' : '');
    chip.textContent = y + '년';
    chip.onclick = () => {
      selectedYear = y;
      yearChips.querySelectorAll('.year-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderDateList();
    };
    yearChips.appendChild(chip);
  });

  renderDateList();
  archiveOverlay.classList.add('open');
}

archiveToggle.addEventListener('click', () => openDatePicker('view'));
adminDateChip.addEventListener('click', () => openDatePicker('admin'));
document.getElementById('archiveCancel').addEventListener('click', () => archiveOverlay.classList.remove('open'));
archiveOverlay.addEventListener('click', (e) => { if(e.target === archiveOverlay) archiveOverlay.classList.remove('open'); });
archiveExit.addEventListener('click', () => {
  archiveDate = null;
  render();
});

archiveDateChange.addEventListener('click', () => openDatePicker('view'));

function showConfirm(message, onConfirm){
  confirmMessage.textContent = message;
  confirmOverlay.classList.add('open');
  const okBtn = document.getElementById('confirmOk');
  const cancelBtn = document.getElementById('confirmCancel');
  function cleanup(){
    confirmOverlay.classList.remove('open');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
  }
  function onOk(){ cleanup(); onConfirm(); }
  function onCancel(){ cleanup(); }
  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
}

function openAdminLogin(){
  adminPassword.value = '';
  adminOverlay.classList.add('open');
  adminPassword.focus();
}

function closeAdminLogin(){
  adminOverlay.classList.remove('open');
}

function tryAdminLogin(){
  if(adminPassword.value === '1114!'){
    adminMode = true;
    adminWorkingDate = todayStr();
    archiveDate = null;
    closeAdminLogin();
    showToast('관리자 모드입니다');
    render();
  }else{
    showToast('비밀번호가 올바르지 않습니다');
    adminPassword.value = '';
    adminPassword.focus();
  }
}

adminToggle.addEventListener('click', openAdminLogin);
adminExit.addEventListener('click', () => {
  adminMode = false;
  adminWorkingDate = null;
  showToast('일반 모드로 전환되었습니다');
  render();
});
document.getElementById('adminOk').addEventListener('click', tryAdminLogin);
document.getElementById('adminCancel').addEventListener('click', closeAdminLogin);
adminPassword.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryAdminLogin(); });
adminOverlay.addEventListener('click', (e) => { if(e.target === adminOverlay) closeAdminLogin(); });

document.getElementById('openAdd').onclick = openAdd;
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('saveBtn').onclick = saveContact;
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

attachTabSwipe();
render();

  navigator.serviceWorker.register('./sw.js').then(registration => {
    console.log('Service Worker 등록 성공:', registration);
  }).catch(error => {
    console.log('Service Worker 등록 실패:', error);
  });
}
